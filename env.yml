# Conda environment for PGFS (Policy Gradient on Feasible Syntheses).
#
# Create:
#   cd PGFS
#   conda env create -f env.yml
#   conda activate pgfs
#   pip install -e .
#
# Update an existing env:
#   conda env update -n pgfs -f env.yml --prune
#
# CPU-only machines: remove the ``pytorch-cuda`` line and swap ``faiss-gpu``
# for ``faiss-cpu`` (or ``pip install faiss-cpu`` after create).

name: pgfs
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # PyTorch (CUDA 12.1 wheels via pytorch + nvidia channels)
  - pytorch>=2.1
  - pytorch-cuda=12.1
  # Chemistry + numerics
  - rdkit>=2023.09
  - numpy>=1.26,<2
  - pyyaml>=6.0
  # kNN retrieval (GPU build; see header note for CPU-only)
  - faiss-gpu>=1.7.4
  - pip:
    - gymnasium>=0.29
    - wandb>=0.16
